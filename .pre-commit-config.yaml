repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: gdformat
        name: gdformat
        entry: gdformat --check
        language: system
        types: [gdscript]
        files: \.gd$
