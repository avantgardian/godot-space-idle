repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      # Lint all project GDScript — scripts/ (game) + tests/ + bench/ share the same style (#312).
      # CI runs full-repo `scripts/ tests/ bench/`; pre-commit is incremental (changed files only) via
      # `types: [gdscript]` + `files:` so typical single-file commits are ~3× faster. Vendor `addons/` is excluded.
      - id: gdformat
        name: gdformat
        entry: gdformat --check
        language: python
        additional_dependencies: [gdtoolkit==4.5.0]
        types: [gdscript]
        files: ^(scripts|tests|bench)/.*\.gd$

      - id: gdlint
        name: gdlint
        entry: gdlint
        language: python
        additional_dependencies: [gdtoolkit==4.5.0]
        types: [gdscript]
        files: ^(scripts|tests|bench)/.*\.gd$

      - id: godot-typing
        name: godot-typing (strict)
        entry: bash -c 'GODOT_BIN="${GODOT_BIN:-/Users/avantgardian/Library/Application Support/Steam/steamapps/common/Godot Engine/Godot.app/Contents/MacOS/Godot}"; if [ ! -x "$GODOT_BIN" ] && command -v godot >/dev/null 2>&1; then GODOT_BIN=$(command -v godot); fi; ERR_PAT="SCRIPT ERROR|SHADER ERROR|Shader compilation failed|ERROR.*(Failed|Resource file not found|Parse [Ee]rror|Could not preload|Cannot open file)"; if [ -x "$GODOT_BIN" ]; then set -o pipefail; "$GODOT_BIN" --headless --editor --quit 2>&1 | tee /tmp/godot_typing.log; EC=${PIPESTATUS[0]}; if [ $EC -ne 0 ]; then echo "Godot --editor --quit exited $EC"; exit $EC; fi; if grep -qE "$ERR_PAT" /tmp/godot_typing.log; then echo "Strict typing / shader / resource errors found"; grep -E "$ERR_PAT" /tmp/godot_typing.log; exit 1; fi; for f in $(find scripts -name "*.gd"); do "$GODOT_BIN" --headless --check-only --script "res://$f" 2>&1 | tee -a /tmp/godot_typing.log; EC=${PIPESTATUS[0]}; if [ $EC -ne 0 ]; then echo "check-only $f exited $EC"; fi; done; if grep -qE "$ERR_PAT" /tmp/godot_typing.log; then echo "Strict typing / resource errors found (per-file)"; grep -E "$ERR_PAT" /tmp/godot_typing.log; exit 1; fi; "$GODOT_BIN" --headless -s res://bench/resource_smoke.gd 2>&1 | tee -a /tmp/godot_typing.log; EC=${PIPESTATUS[0]}; if [ $EC -ne 0 ]; then echo "Resource smoke failed (exit $EC)"; grep -E "$ERR_PAT" /tmp/godot_typing.log || true; exit $EC; fi; if grep -qE "$ERR_PAT" /tmp/godot_typing.log; then echo "Resource load errors after smoke"; grep -E "$ERR_PAT" /tmp/godot_typing.log; exit 1; fi; echo "Strict typing + shader + resource check passed"; else echo "Godot binary not found, skipping strict typing check"; fi'
        language: system
        pass_filenames: false
        always_run: true
