repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      # Lint all project GDScript — scripts/ (game) + tests/ + bench/ share the same style (#312).
      # CI runs full-repo `scripts/ tests/ bench/`; pre-commit is incremental (changed files only) via
      # `types: [gdscript]` + `files:` so typical single-file commits are ~3× faster. Vendor `addons/` is excluded.
      - id: gdformat
        name: gdformat
        entry: gdformat --check
        language: python
        additional_dependencies: [gdtoolkit==4.5.0]
        types: [gdscript]
        files: ^(scripts|tests|bench)/.*\.gd$

      - id: gdlint
        name: gdlint
        entry: gdlint
        language: python
        additional_dependencies: [gdtoolkit==4.5.0]
        types: [gdscript]
        files: ^(scripts|tests|bench)/.*\.gd$

      - id: godot-typing
        name: godot-typing (strict)
        entry: bash -c 'GODOT_BIN="${GODOT_BIN:-/Users/avantgardian/Library/Application Support/Steam/steamapps/common/Godot Engine/Godot.app/Contents/MacOS/Godot}"; if [ ! -x "$GODOT_BIN" ] && command -v godot >/dev/null 2>&1; then GODOT_BIN=$(command -v godot); fi; ERR_PAT="SCRIPT ERROR|SHADER ERROR|Shader compilation failed|ERROR.*(Failed|Resource file not found|Parse [Ee]rror|Could not preload|Cannot open file)"; if [ -x "$GODOT_BIN" ]; then "$GODOT_BIN" --headless --editor --quit > /tmp/godot_typing.log 2>&1; EC=$?; if [ $EC -ne 0 ]; then echo "Godot --editor --quit exited $EC"; cat /tmp/godot_typing.log; exit $EC; fi; if grep -qE "$ERR_PAT" /tmp/godot_typing.log; then echo "Strict typing / shader / resource errors found"; grep -E "$ERR_PAT" /tmp/godot_typing.log; cat /tmp/godot_typing.log; exit 1; fi; for f in $(find scripts -name "*.gd"); do "$GODOT_BIN" --headless --check-only --script "res://$f" >> /tmp/godot_typing.log 2>&1; EC=$?; if [ $EC -ne 0 ]; then echo "check-only $f exited $EC"; fi; done; if grep -qE "$ERR_PAT" /tmp/godot_typing.log; then echo "Strict typing / resource errors found (per-file)"; grep -E "$ERR_PAT" /tmp/godot_typing.log; cat /tmp/godot_typing.log; exit 1; fi; "$GODOT_BIN" --headless -s res://bench/resource_smoke.gd >> /tmp/godot_typing.log 2>&1; EC=$?; if [ $EC -ne 0 ]; then echo "Resource smoke failed (exit $EC)"; grep -E "$ERR_PAT" /tmp/godot_typing.log || true; cat /tmp/godot_typing.log; exit $EC; fi; if grep -qE "$ERR_PAT" /tmp/godot_typing.log; then echo "Resource load errors after smoke"; grep -E "$ERR_PAT" /tmp/godot_typing.log; cat /tmp/godot_typing.log; exit 1; fi; echo "Strict typing + shader + resource check passed"; else echo "::warning::Godot binary not found (tried $GODOT_BIN and godot on PATH) - skipping strict typing check"; echo "hint - export GODOT_BIN=/path/to/Godot or brew install godot (Steam default at /Users/avantgardian/Library/Application Support/Steam/steamapps/common/Godot Engine/Godot.app/Contents/MacOS/Go... (line truncated to 2000 chars)
        language: system
        pass_filenames: false
        always_run: false
        files: \.(gd|gdshader)$
        verbose: true

      - id: qa-smoke
        name: qa-smoke (headless gameplay)
        entry: bash -c 'GODOT_BIN="${GODOT_BIN:-/Users/avantgardian/Library/Application Support/Steam/steamapps/common/Godot Engine/Godot.app/Contents/MacOS/Godot}"; if [ ! -x "$GODOT_BIN" ] && command -v godot >/dev/null 2>&1; then GODOT_BIN=$(command -v godot); fi; ERR_PAT="SCRIPT ERROR|SHADER ERROR|Shader compilation failed|push_error|push_warning|WARNING|ERROR.*(Failed|Resource file not found|Parse [Ee]rror|Could not preload|Cannot open file)"; if [ -x "$GODOT_BIN" ]; then cp project.godot /tmp/project.godot.qa.bak; sed "s/=2/=1/g" /tmp/project.godot.qa.bak > project.godot; "$GODOT_BIN" --headless -s res://bench/gameplay_smoke.gd > /tmp/qa_smoke.log 2>&1; EC=$?; mv /tmp/project.godot.qa.bak project.godot; if [ $EC -ne 0 ]; then echo "qa-smoke exited $EC"; cat /tmp/qa_smoke.log; exit $EC; fi; if grep -qE "$ERR_PAT" /tmp/qa_smoke.log; then echo "qa-smoke found debugger errors"; grep -E "$ERR_PAT" /tmp/qa_smoke.log; cat /tmp/qa_smoke.log; exit 1; fi; echo "qa-smoke passed"; else echo "::warning::Godot binary not found (tried $GODOT_BIN and godot on PATH) - skipping qa-smoke check"; echo "hint - export GODOT_BIN=/path/to/Godot or brew install godot"; fi'
        language: system
        pass_filenames: false
        always_run: false
        files: \.(gd|gdshader|tscn|tres)$
        verbose: true
