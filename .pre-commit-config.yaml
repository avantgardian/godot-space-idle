repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: gdformat
        name: gdformat
        entry: gdformat --check
        language: python
        additional_dependencies: [gdtoolkit==4.5.0]
        types: [gdscript]
        files: \.gd$

      - id: gdlint
        name: gdlint
        entry: gdlint scripts/
        language: python
        additional_dependencies: [gdtoolkit==4.5.0]
        pass_filenames: false

      - id: godot-typing
        name: godot-typing (strict)
        entry: bash -c 'GODOT_BIN="${GODOT_BIN:-/Users/avantgardian/Library/Application Support/Steam/steamapps/common/Godot Engine/Godot.app/Contents/MacOS/Godot}"; if [ ! -x "$GODOT_BIN" ] && command -v godot >/dev/null 2>&1; then GODOT_BIN=$(command -v godot); fi; if [ -x "$GODOT_BIN" ]; then "$GODOT_BIN" --headless --editor --quit 2>&1 | tee /tmp/godot_typing.log; if grep -q "SCRIPT ERROR" /tmp/godot_typing.log; then echo "Strict typing errors found"; grep "SCRIPT ERROR" /tmp/godot_typing.log; exit 1; fi; for f in $(find scripts -name "*.gd"); do "$GODOT_BIN" --headless --check-only --script "res://$f" 2>&1 | tee -a /tmp/godot_typing.log; done; if grep -q "SCRIPT ERROR" /tmp/godot_typing.log; then echo "Strict typing errors found (per-file)"; grep "SCRIPT ERROR" /tmp/godot_typing.log; exit 1; fi; echo "Strict typing check passed"; else echo "Godot binary not found, skipping strict typing check"; fi'
        language: system
        pass_filenames: false
        always_run: true
