name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install gdtoolkit==4.5.0
      - run: gdformat --check scripts/
      - run: gdlint scripts/

  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot
        run: |
          curl -fSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --import

      - name: Check strict typing (warnings as errors)
        run: |
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --quit 2>&1 | tee godot.log
          if grep -qE "SCRIPT ERROR|SHADER ERROR|Shader compilation failed" godot.log; then
            echo "::error::Strict typing / shader errors found (warnings treated as errors)"
            grep -E "SCRIPT ERROR|SHADER ERROR|Shader compilation failed" godot.log
            exit 1
          fi
          # Also check each GDScript file individually (catches unreferenced new files)
          for f in $(find scripts -name "*.gd"); do
            ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --check-only --script "res://$f" 2>&1 | tee -a godot.log
          done
          if grep -qE "SCRIPT ERROR|SHADER ERROR|Shader compilation failed" godot.log; then
            echo "::error::Strict typing / shader errors found in per-file check"
            grep -E "SCRIPT ERROR|SHADER ERROR|Shader compilation failed" godot.log
            exit 1
          fi
          echo "Strict typing + shader check passed"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot
        run: |
          curl -fSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --import

      - name: Run GUT tests (relax warnings for tests)
        run: |
          cp project.godot project.godot.bak
          sed -i 's/=2/=1/g' project.godot
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://addons/gut/gut_cmdln.gd -gexit -gmaximize; EXIT=$?
          mv project.godot.bak project.godot
          exit $EXIT

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      GODOT_VERSION: 4.7
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot
        run: |
          curl -fSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --import

      - name: Run benches (relax warnings for bench, advisory)
        run: |
          set +e
          cp project.godot project.godot.bak
          sed -i 's/=2/=1/g' project.godot
          echo "--- bench: full suite ---"
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://bench/bench.gd > bench_current.log 2>&1
          BENCH_EXIT=$?
          echo "bench exit: $BENCH_EXIT"
          cat bench_current.log
          # Extract JSON line for checker (bench may exit 1 on budget breach — still produces JSON)
          grep "^{" bench_current.log > bench/current.json || (echo "::warning::bench produced no JSON"; cat bench_current.log; mv project.godot.bak project.godot; exit 0)
          cat bench/current.json
          mv project.godot.bak project.godot
          # Don't fail step on bench budget breach — gate is in next step (advisory)
          exit 0

      - name: Check perf gate vs baseline (advisory, 30% regression or absolute thresholds)
        run: |
          echo "--- baseline ---"
          cat bench/baseline.json
          echo "--- current ---"
          cat bench/current.json
          set +e
          python3 bench/check_perf.py --current bench/current.json --baseline bench/baseline.json 2>&1 | tee perf_report.log
          EXIT=${PIPESTATUS[0]}
          echo "perf gate exit: $EXIT" | tee -a perf_report.log
          exit $EXIT

      - name: Write perf summary to Job Summary
        if: always()
        run: |
          echo "## Perf bench gate (advisory)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Thresholds: \`trail 8× <0.08 ms\` (#295) · \`starfield <150 ms\` (#296) · \`>30% regression\` vs \`bench/baseline.json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat perf_report.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no perf_report.log)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: \`bench/current.json\` + \`bench/baseline.json\` + \`bench_current.log\`" >> $GITHUB_STEP_SUMMARY
          cat perf_report.log 2>/dev/null || true

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-bench-results
          path: |
            bench/current.json
            bench/baseline.json
            perf_report.log
            bench_current.log
          if-no-files-found: warn
          retention-days: 14
