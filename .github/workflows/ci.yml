name: CI
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "shaders/**"
      - "scenes/**"
      - "project.godot"
      - "bench/**"
      - ".github/**"
      - "requirements.txt"
      - "addons/**"
      - "resources/**"
      - "export_presets.cfg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      # Lint all GDScript — scripts/ (game), tests/ and bench/ share the same style (#312)
      - run: gdformat --check scripts/ tests/ bench/
      - run: gdlint scripts/ tests/ bench/

  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Check strict typing (warnings as errors)
        run: |
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --quit 2>&1 | tee godot.log
          if grep -qE "SCRIPT ERROR|SHADER ERROR|Shader compilation failed" godot.log; then
            echo "::error::Strict typing / shader errors found (warnings treated as errors)"
            grep -E "SCRIPT ERROR|SHADER ERROR|Shader compilation failed" godot.log
            exit 1
          fi
          # Also check each GDScript file individually (catches unreferenced new files)
          for f in $(find scripts -name "*.gd"); do
            ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --check-only --script "res://$f" 2>&1 | tee -a godot.log
          done
          if grep -qE "SCRIPT ERROR|SHADER ERROR|Shader compilation failed" godot.log; then
            echo "::error::Strict typing / shader errors found in per-file check"
            grep -E "SCRIPT ERROR|SHADER ERROR|Shader compilation failed" godot.log
            exit 1
          fi
          echo "Strict typing + shader check passed"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Run GUT tests (relax warnings for tests)
        run: |
          cp project.godot project.godot.bak
          sed -i 's/=2/=1/g' project.godot
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://addons/gut/gut_cmdln.gd -gexit -gmaximize; EXIT=$?
          mv project.godot.bak project.godot
          exit $EXIT

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Run benches (relax warnings) — absolute budget breach blocks PR
        run: |
          set +e
          cp project.godot project.godot.bak
          sed -i 's/=2/=1/g' project.godot
          echo "--- bench: full suite ---"
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://bench/bench.gd > bench_current.log 2>&1
          BENCH_EXIT=$?
          echo "bench exit: $BENCH_EXIT"
          cat bench_current.log
          # Extract JSON line for checker (bench may exit 1 on budget breach — still produces JSON)
          grep "^{" bench_current.log > bench/current.json || (echo "::error::bench produced no JSON"; cat bench_current.log; mv project.godot.bak project.godot; exit 1)
          cat bench/current.json
          mv project.godot.bak project.godot
          # Bench exit 1 means absolute thresholds breached — required gate (#310)
          if [ $BENCH_EXIT -ne 0 ]; then
            echo "::error::Bench absolute thresholds breached (trail 0.08 ms / starfield 150 ms) — blocks PR"
            exit $BENCH_EXIT
          fi
          exit 0

      - name: Check absolute thresholds (required — blocks PR)
        run: |
          echo "--- baseline ---"
          cat bench/baseline.json
          echo "--- current ---"
          cat bench/current.json
          set +e
          python3 bench/check_perf.py --current bench/current.json --baseline bench/baseline.json --mode absolute 2>&1 | tee perf_report_abs.log
          EXIT=${PIPESTATUS[0]}
          echo "absolute gate exit: $EXIT" | tee -a perf_report_abs.log
          cp perf_report_abs.log perf_report.log
          exit $EXIT

      - name: Check regression vs baseline (advisory — warns only, does not block)
        if: always()
        continue-on-error: true
        run: |
          echo "--- regression check (advisory, >30% vs baseline) ---"
          # Ensure perf_report.log exists even if absolute gate failed
          touch perf_report.log
          set +e
          python3 bench/check_perf.py --current bench/current.json --baseline bench/baseline.json --mode regression 2>&1 | tee perf_report_regr.log
          EXIT=${PIPESTATUS[0]}
          echo "regression gate exit: $EXIT" | tee -a perf_report_regr.log
          echo "" >> perf_report.log
          echo "--- regression (advisory) ---" >> perf_report.log
          cat perf_report_regr.log >> perf_report.log
          if [ $EXIT -ne 0 ]; then
            echo "::warning::Perf regression >30% detected (advisory, not blocking — see perf_report.log)"
          fi
          exit $EXIT

      - name: Write perf summary to Job Summary
        if: always()
        run: |
          echo "## Perf bench gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Required:** \`trail 8× <0.08 ms\` (#295) · \`starfield <150 ms\` (#296) — breach blocks PR." >> $GITHUB_STEP_SUMMARY
          echo "**Advisory:** \`>30% regression\` vs \`bench/baseline.json\` — warning only until runner variance tightened (local 70 ms vs CI 124 ms)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat perf_report.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no perf_report.log)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: \`bench/current.json\` + \`bench/baseline.json\` + \`bench_current.log\`" >> $GITHUB_STEP_SUMMARY
          cat perf_report.log 2>/dev/null || true

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-bench-results
          path: |
            bench/current.json
            bench/baseline.json
            perf_report.log
            perf_report_abs.log
            perf_report_regr.log
            bench_current.log
          if-no-files-found: warn
          retention-days: 14

  export-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot + export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: "true"

      - name: Validate Web export
        run: |
          mkdir -p /tmp/web
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Web" /tmp/web/index.html
          echo "Web export validation passed"
          ls -lh /tmp/web/
