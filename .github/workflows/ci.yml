name: CI
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "shaders/**"
      - "scenes/**"
      - "project.godot"
      - "bench/**"
      - ".github/**"
      - "requirements.txt"
      - "addons/**"
      - "resources/**"
      - "export_presets.cfg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      # Lint all GDScript — scripts/ (game), tests/ and bench/ share the same style (#312)
      - run: gdformat --check scripts/ tests/ bench/
      - run: gdlint scripts/ tests/ bench/

  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Check strict typing (warnings as errors)
        run: |
          set -o pipefail
          ERR_PAT="SCRIPT ERROR|SHADER ERROR|Shader compilation failed|ERROR.*(Failed|Resource file not found|Parse [Ee]rror|Could not preload|Cannot open file)"
          echo "=== editor --quit ==="
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --quit 2>&1 | tee godot.log; EC=${PIPESTATUS[0]}
          if [ $EC -ne 0 ]; then
            echo "::error::Godot --editor --quit exited $EC"
            exit $EC
          fi
          if grep -qE "$ERR_PAT" godot.log; then
            echo "::error::Strict typing / shader / resource errors found (warnings treated as errors)"
            grep -E "$ERR_PAT" godot.log
            exit 1
          fi
          echo "=== per-file script check (catches unreferenced new files) ==="
          for f in $(find scripts -name "*.gd"); do
            ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --check-only --script "res://$f" 2>&1 | tee -a godot.log; EC=${PIPESTATUS[0]}
            if [ $EC -ne 0 ]; then
              echo "::warning::check-only $f exited $EC"
            fi
          done
          if grep -qE "$ERR_PAT" godot.log; then
            echo "::error::Strict typing / resource errors found in per-file check"
            grep -E "$ERR_PAT" godot.log
            exit 1
          fi
          echo "=== resource smoke (scenes + .tres) ==="
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://bench/resource_smoke.gd 2>&1 | tee -a godot.log; EC=${PIPESTATUS[0]}
          if [ $EC -ne 0 ]; then
            echo "::error::Resource smoke failed (exit $EC) — broken .tscn/.tres reference"
            grep -E "$ERR_PAT" godot.log || true
            exit $EC
          fi
          if grep -qE "$ERR_PAT" godot.log; then
            echo "::error::Resource load errors found after smoke"
            grep -E "$ERR_PAT" godot.log
            exit 1
          fi
          echo "Strict typing + shader + resource check passed"

      - name: Upload Godot log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: godot-typing-log
          path: godot.log
          if-no-files-found: warn
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Run GUT tests (relax warnings for tests)
        run: |
          cp project.godot project.godot.bak
          sed -i 's/=2/=1/g' project.godot
          set -o pipefail
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://addons/gut/gut_cmdln.gd -gexit -gmaximize -glog=2 -gjunit_xml_file=gut-junit.xml 2>&1 | tee godot.log; EXIT=${PIPESTATUS[0]}
          mv project.godot.bak project.godot
          echo "GUT exit: $EXIT — junit: $(ls -lh gut-junit.xml 2>&1 | head -n 1)"
          if [ -f gut-junit.xml ]; then
            TESTS=$(grep -o 'tests="[0-9]*"' gut-junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            echo "JUnit tests: $TESTS"
            if [ "$TESTS" -lt 235 ]; then
              echo "::error::Test count $TESTS below expected 235 — possible suite deletion"
              exit 1
            fi
          else
            echo "::error::gut-junit.xml not produced"
            exit 1
          fi
          exit $EXIT

      - name: Publish Test Report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'gut-junit.xml'
          check_name: 'GUT Test Report'
          detailed_summary: true
          include_passed: true
          fail_on_failure: true

      - name: Upload GUT artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gut-test-results
          path: |
            gut-junit.xml
            godot.log
          if-no-files-found: warn
          retention-days: 14

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Run benches (relax warnings) — absolute budget breach blocks PR
        run: |
          set +e
          cp project.godot project.godot.bak
          sed -i 's/=2/=1/g' project.godot
          echo "--- bench: full suite ---"
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://bench/bench.gd > bench_current.log 2>&1
          BENCH_EXIT=$?
          echo "bench exit: $BENCH_EXIT"
          cat bench_current.log
          # Extract JSON — whitespace-tolerant (survives leading spaces/tabs from Godot log prefix).
          # Mirrors bench/check_perf.py:load_json() reversed-line search; replaces fragile `grep \"^{\"`.
          python3 << 'PY' || { echo "::error::bench JSON extraction failed"; cat bench_current.log; mv project.godot.bak project.godot; exit 1; }
          import json
          import pathlib
          import sys
          log = pathlib.Path("bench_current.log").read_text(encoding="utf-8", errors="ignore")
          found = None
          for line in reversed(log.splitlines()):
              s = line.strip()
              if s.startswith("{") and s.endswith("}"):
                  try:
                      found = json.loads(s)
                      break
                  except json.JSONDecodeError:
                      continue
          if found is None:
              print("::error::bench produced no JSON (even after whitespace-tolerant search)")
              sys.exit(1)
          pathlib.Path("bench/current.json").write_text(json.dumps(found))
          print(f"extracted: {json.dumps(found)[:300]}")
          PY
          cat bench/current.json
          mv project.godot.bak project.godot
          # Bench exit 1 means absolute thresholds breached — required gate (#310)
          if [ $BENCH_EXIT -ne 0 ]; then
            echo "::error::Bench absolute thresholds breached (trail 0.08 ms / starfield 150 ms) — blocks PR"
            exit $BENCH_EXIT
          fi
          exit 0

      - name: Check absolute thresholds (required — blocks PR)
        if: always()
        run: |
          echo "--- baseline ---"
          cat bench/baseline.json
          echo "--- current ---"
          cat bench/current.json
          set +e
          python3 bench/check_perf.py --current bench/current.json --baseline bench/baseline.json --mode absolute 2>&1 | tee perf_report_abs.log
          EXIT=${PIPESTATUS[0]}
          echo "absolute gate exit: $EXIT" | tee -a perf_report_abs.log
          cp perf_report_abs.log perf_report.log
          exit $EXIT

      - name: Check regression vs baseline (advisory — warns only, does not block)
        if: always()
        continue-on-error: true
        run: |
          echo "--- regression check (advisory, >30% vs baseline) ---"
          # Ensure perf_report.log exists even if absolute gate failed
          touch perf_report.log
          set +e
          python3 bench/check_perf.py --current bench/current.json --baseline bench/baseline.json --mode regression 2>&1 | tee perf_report_regr.log
          EXIT=${PIPESTATUS[0]}
          echo "regression gate exit: $EXIT" | tee -a perf_report_regr.log
          echo "" >> perf_report.log
          echo "--- regression (advisory) ---" >> perf_report.log
          cat perf_report_regr.log >> perf_report.log
          if [ $EXIT -ne 0 ]; then
            echo "::warning::Perf regression >30% detected (advisory, not blocking — see perf_report.log)"
          fi
          exit $EXIT

      - name: Write perf summary to Job Summary
        if: always()
        run: |
          echo "## Perf bench gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Required:** \`trail 8× <0.08 ms\` (#295) · \`starfield <150 ms\` (#296) — breach blocks PR." >> $GITHUB_STEP_SUMMARY
          echo "**Advisory:** \`>30% regression\` vs \`bench/baseline.json\` — warning only until runner variance tightened (local 70 ms vs CI 124 ms)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat perf_report.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no perf_report.log)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: \`bench/current.json\` + \`bench/baseline.json\` + \`bench_current.log\`" >> $GITHUB_STEP_SUMMARY
          cat perf_report.log 2>/dev/null || true

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-bench-results
          path: |
            bench/current.json
            bench/baseline.json
            perf_report.log
            perf_report_abs.log
            perf_report_regr.log
            bench_current.log
          if-no-files-found: warn
          retention-days: 14

  qa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Run gameplay smoke (relax warnings) — required gate
        run: |
          cp project.godot project.godot.bak
          sed -i 's/=2/=1/g' project.godot
          set -o pipefail
          ERR_PAT="SCRIPT ERROR|SHADER ERROR|Shader compilation failed|push_error|push_warning|WARNING|Invalid get index|Condition.*failed|ERROR.*(Failed|Resource file not found|Parse [Ee]rror|Could not preload|Cannot open file)"
          echo "=== gameplay smoke (headless) ==="
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://bench/gameplay_smoke.gd 2>&1 | tee qa-smoke.log; EC=${PIPESTATUS[0]}
          mv project.godot.bak project.godot
          echo "qa-smoke exit: $EC"
          cat qa-smoke.log
          if [ $EC -ne 0 ]; then
            echo "::error::qa-smoke exited $EC"
            exit $EC
          fi
          if grep -qE "$ERR_PAT" qa-smoke.log; then
            echo "::error::qa-smoke found debugger errors (SCRIPT ERROR / push_error / WARNING)"
            grep -E "$ERR_PAT" qa-smoke.log
            exit 1
          fi
          echo "qa-smoke passed"

      - name: Upload qa-smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-smoke-log
          path: qa-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload qa-smoke log (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-smoke-log-always
          path: qa-smoke.log
          if-no-files-found: warn
          retention-days: 14

  export-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot + export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: "true"

      - name: Validate Web export
        run: |
          mkdir -p /tmp/web
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Web" /tmp/web/index.html
          echo "Web export validation passed"
          ls -lh /tmp/web/
