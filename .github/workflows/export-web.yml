name: Export Web
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "shaders/**"
      - "scenes/**"
      - "project.godot"
      - "bench/**"
      - ".github/**"
      - "requirements.txt"
      - "addons/**"
      - "resources/**"
      - "export_presets.cfg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Godot + export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: "true"

      - name: Export Web
        run: |
          mkdir -p build/web
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Web" ./build/web/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
