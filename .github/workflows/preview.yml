name: Preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]
    paths:
      - "scripts/**"
      - "shaders/**"
      - "scenes/**"
      - "project.godot"
      - "bench/**"
      - ".github/**"
      - "requirements.txt"
      - "addons/**"
      - "resources/**"
      - "export_presets.cfg"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Godot + export templates
        if: github.event.action != 'closed'
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: "true"

      - name: Export Web
        if: github.event.action != 'closed'
        run: |
          mkdir -p build/web
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Web" ./build/web/index.html

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/web
          preview-branch: gh-pages
          umbrella-dir: pr-preview
